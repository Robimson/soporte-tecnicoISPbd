<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Panel de administración — SoporteNet</title>

    <link rel="stylesheet"
          href="../css/estilos.css">

    <!-- ===================================================== -->
    <!-- Ajuste local: separa visualmente cada módulo (Resumen, -->
    <!-- Solicitudes, Reportes) para que no se fundan al hacer  -->
    <!-- scroll. No modifica estilos.css, solo esta página.     -->
    <!-- ===================================================== -->
    <style>
        .seccion {
            background: var(--color-superficie);
            border: 1px solid var(--color-borde);
            border-radius: var(--radio-lg);
            box-shadow: var(--sombra);
            padding: 24px 24px 28px;
            margin-bottom: 28px;
            scroll-margin-top: 20px;
        }

        .seccion h2 {
            margin-top: 0;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--color-borde);
        }

        .fila-metricas {
            margin-bottom: 0;
        }
    </style>

</head>

<body>

<div class="app-shell">

    <!-- ===================================================== -->
    <!-- SIDEBAR -->
    <!-- ===================================================== -->

    <aside class="sidebar">

        <div class="sidebar-marca">

            <span class="logo">

                <img src="../css/logo.png"
                     alt="SoporteNet">

            </span>

            SoporteNet

        </div>

        <span class="sidebar-rol">
            Administrador
        </span>

        <nav class="sidebar-nav">

            <a href="#resumen">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <rect x="3"
                          y="3"
                          width="7"
                          height="7"
                          rx="1"/>

                    <rect x="14"
                          y="3"
                          width="7"
                          height="7"
                          rx="1"/>

                    <rect x="3"
                          y="14"
                          width="7"
                          height="7"
                          rx="1"/>

                    <rect x="14"
                          y="14"
                          width="7"
                          height="7"
                          rx="1"/>

                </svg>

                Resumen

            </a>


            <a href="#solicitudes">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M4 6h16"/>
                    <path d="M4 12h16"/>
                    <path d="M4 18h10"/>

                </svg>

                Solicitudes

            </a>


            <a href="#reportes-pendientes">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M6 2h8l4 4v14a1 1 0 01-1 1H6a1 1 0 01-1-1V3a1 1 0 011-1z"/>

                    <path d="M9 13h6"/>
                    <path d="M9 17h6"/>
                    <path d="M14 2v4h4"/>

                </svg>

                Reportes pendientes

            </a>

        </nav>


        <div class="sidebar-pie">

            <span class="id-usuario"
                  id="texto-usuario">
            </span>

            <button class="secundario"
                    onclick="cerrarSesion()">

                Cerrar sesión

            </button>

        </div>

    </aside>


    <!-- ===================================================== -->
    <!-- CONTENIDO -->
    <!-- ===================================================== -->

    <main class="contenido-principal">

        <h1>
            Panel de administración
        </h1>


        <!-- ================================================= -->
        <!-- RESUMEN -->
        <!-- ================================================= -->

        <div class="seccion"
             id="resumen">

            <div class="fila-metricas"
                 id="fila-metricas">
            </div>

        </div>


        <!-- ================================================= -->
        <!-- PANEL ASIGNAR -->
        <!-- ================================================= -->

        <div class="tarjeta oculto"
             id="panel-asignar">

            <h2>

                Asignar solicitud

                <span id="id-solicitud-asignar">
                </span>

            </h2>


            <div id="mensaje-error-asignar"
                 class="mensaje-error oculto">
            </div>


            <form id="form-asignar">


                <div class="campo">

                    <label>
                        Asignar a
                    </label>


                    <label style="font-weight: normal;
                                  display: inline-block;
                                  margin-right: 16px;">

                        <input type="radio"
                               name="tipo-destino"
                               value="tecnico"
                               checked>

                        Técnico

                    </label>


                    <label style="font-weight: normal;
                                  display: inline-block;">

                        <input type="radio"
                               name="tipo-destino"
                               value="grupo">

                        Grupo técnico

                    </label>

                </div>


                <div class="campo"
                     id="campo-tecnico">

                    <label for="select-tecnico">
                        Técnico
                    </label>

                    <select id="select-tecnico">
                    </select>

                </div>


                <div class="campo oculto"
                     id="campo-grupo">

                    <label for="select-grupo">
                        Grupo técnico
                    </label>

                    <select id="select-grupo">
                    </select>

                </div>


                <div class="campo"
                     style="max-width: 240px;">

                    <label for="select-prioridad">
                        Prioridad (opcional)
                    </label>

                    <select id="select-prioridad">

                        <option value="">
                            Sin cambiar
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="motivo-reasignacion">
                        Motivo (solo si ya tenía asignación previa)
                    </label>

                    <input type="text"
                           id="motivo-reasignacion"
                           placeholder="Opcional">

                </div>


                <button type="submit"
                        id="btn-confirmar-asignar">

                    Asignar

                </button>


                <button type="button"
                        class="secundario"
                        id="btn-cancelar-asignar">

                    Cancelar

                </button>

            </form>

        </div>


        <!-- ================================================= -->
        <!-- PANEL RECHAZAR -->
        <!-- ================================================= -->

        <div class="tarjeta oculto"
             id="panel-rechazar">

            <h2>

                Rechazar reporte

                <span id="id-reporte-rechazar">
                </span>

            </h2>


            <div id="mensaje-error-rechazar"
                 class="mensaje-error oculto">
            </div>


            <form id="form-rechazar">

                <div class="campo">

                    <label for="comentario-rechazo">
                        Motivo del rechazo
                    </label>

                    <textarea
                            id="comentario-rechazo"
                            required
                            placeholder="¿Qué le falta al reporte?"></textarea>
                </div>


                <button type="submit"
                        id="btn-confirmar-rechazar"
                        class="peligro">

                    Rechazar reporte

                </button>


                <button type="button"
                        class="secundario"
                        id="btn-cancelar-rechazar">

                    Cancelar

                </button>

            </form>

        </div>


        <!-- ================================================= -->
        <!-- PANEL DE EVIDENCIAS -->
        <!-- ================================================= -->

        <div class="tarjeta oculto"
             id="panel-evidencias">

            <h2>

                Evidencias de la solicitud

                <span id="id-solicitud-evidencias">
                </span>

            </h2>


            <div id="mensaje-error-evidencias"
                 class="mensaje-error oculto">
            </div>


            <div id="detalle-solicitud-evidencias">

            </div>


            <div id="contenedor-evidencias">

                <div class="vacio">
                    Cargando evidencias...
                </div>

            </div>


            <br>


            <button type="button"
                    class="secundario"
                    id="btn-cerrar-evidencias">

                Cerrar

            </button>

        </div>


        <!-- ================================================= -->
        <!-- SOLICITUDES -->
        <!-- ================================================= -->

        <div class="seccion"
             id="solicitudes">

            <h2>
                Solicitudes
            </h2>


            <div class="fila-filtros">

                <div class="campo">

                    <label for="filtro-estado">
                        Filtrar por estado
                    </label>

                    <select id="filtro-estado">

                        <option value="">
                            Todas
                        </option>

                    </select>

                </div>

            </div>


            <div id="mensaje-error-solicitudes"
                 class="mensaje-error oculto">
            </div>


            <div id="contenedor-tabla-solicitudes">
            </div>


            <div class="paginacion"
                 id="paginacion-solicitudes">
            </div>

        </div>


        <!-- ================================================= -->
        <!-- REPORTES -->
        <!-- ================================================= -->

        <div class="seccion"
             id="reportes-pendientes">

            <h2>
                Reportes pendientes de aprobación
            </h2>


            <div id="mensaje-error-reportes"
                 class="mensaje-error oculto">
            </div>


            <div id="contenedor-tabla-reportes">
            </div>


            <div class="paginacion"
                 id="paginacion-reportes">
            </div>

        </div>

    </main>

</div>


<script src="../js/api.js"></script>

<script src="../js/admin.js"></script>

</body>

</html>
