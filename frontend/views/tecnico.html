<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis tareas — SoporteNet</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-marca"><span class="logo"><img src="../css/logo.png" alt="SoporteNet"></span> SoporteNet</div>
        <span class="sidebar-rol">Técnico</span>
        <nav class="sidebar-nav">
            <a href="#resumen">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Resumen
            </a>
            <a href="#mis-tareas">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3a1 1 0 011-1h4a1 1 0 011 1v1M9 13l2 2 4-4"/></svg>
                Mis tareas
            </a>
        </nav>
        <div class="sidebar-pie">
            <span class="id-usuario" id="texto-usuario"></span>
            <button class="secundario" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>
    </aside>

    <main class="contenido-principal">
        <h1>Mis tareas</h1>

        <div class="seccion" id="resumen">
            <div class="fila-metricas" id="fila-metricas"></div>
        </div>

        <div class="tarjeta oculto" id="panel-reportar">
            <h2>Reportar solución — solicitud <span id="id-solicitud-reportar"></span></h2>
            <div id="mensaje-error-reportar" class="mensaje-error oculto"></div>
            <form id="form-reportar">
                <div class="campo">
                    <label for="detalle-reporte">¿Qué se hizo para resolverlo?</label>
                    <textarea id="detalle-reporte" required placeholder="Describe la solución aplicada..."></textarea>
                </div>
                <div class="campo">
                    <label for="input-evidencias">Evidencias (opcional) — hasta 5 imágenes o PDF</label>
                    <input type="file" id="input-evidencias" multiple accept="image/png,image/jpeg,image/jpg,image/webp,application/pdf">
                    <div id="lista-evidencias" class="lista-archivos"></div>
                </div>
                <button type="submit" id="btn-enviar-reporte">Enviar reporte</button>
                <button type="button" class="secundario" id="btn-cancelar-reporte">Cancelar</button>
            </form>
        </div>

        <div class="seccion" id="mis-tareas">
            <div id="mensaje-error-lista" class="mensaje-error oculto"></div>
            <div id="contenedor-tabla"></div>
            <div class="paginacion" id="paginacion"></div>
        </div>
    </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/tecnico.js"></script>
</body>
</html>
