<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis solicitudes — SoporteNet</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-marca"><span class="logo"><img src="../css/logo.png" alt="SoporteNet"></span> SoporteNet</div>
            <span class="sidebar-rol">Cliente</span>
            <nav class="sidebar-nav">
                <a href="#resumen">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    Resumen
                </a>
                <a href="#nueva-solicitud">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
                    Nueva solicitud
                </a>
                <a href="#mis-solicitudes">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
                    Mis solicitudes
                </a>
            </nav>
            <div class="sidebar-pie">
                <span class="id-usuario" id="texto-usuario"></span>
                <button class="secundario" onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </aside>

        <main class="contenido-principal">
            <h1>Mis solicitudes</h1>

            <div class="seccion" id="resumen">
                <div class="fila-metricas" id="fila-metricas"></div>
            </div>

            <div class="seccion tarjeta" id="nueva-solicitud">
                <h2>Nueva solicitud</h2>
                <div id="mensaje-error-crear" class="mensaje-error oculto"></div>
                <form id="form-crear">
                    <div class="campo">
                        <label for="descripcion">Descripción del problema</label>
                        <textarea id="descripcion" required placeholder="Describe qué está pasando..."></textarea>
                    </div>
                    <div class="campo" style="max-width: 300px;">
                        <label for="categoria">Categoría (opcional)</label>
                        <select id="categoria">
                            <option value="">Sin especificar</option>
                        </select>
                    </div>
                    <button type="submit" id="btn-crear">Crear solicitud</button>
                </form>
            </div>

            <div class="seccion" id="mis-solicitudes">
                <h2>Mis solicitudes</h2>
                <div class="fila-filtros">
                    <div class="campo">
                        <label for="filtro-estado">Filtrar por estado</label>
                        <select id="filtro-estado">
                            <option value="">Todas</option>
                        </select>
                    </div>
                </div>

                <div id="mensaje-error-lista" class="mensaje-error oculto"></div>
                <div id="contenedor-tabla"></div>
                <div class="paginacion" id="paginacion"></div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/cliente.js"></script>
</body>
</html>
